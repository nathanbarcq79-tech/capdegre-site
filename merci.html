<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Merci — CAP DEGRÉ°</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--ink:#18313b;--sage:#8caf99;--line:#dbe4dd;--bg:#f7f6f1;--white:#fff;--muted:#586a70}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top right,#dfece3 0,#eef4ef 24%,#f7f6f1 56%,#fcfbf8 100%);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px}
    .box{max-width:700px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;padding:42px;box-shadow:0 20px 40px rgba(24,49,59,.08)}
    .tag{display:inline-flex;padding:8px 12px;border-radius:999px;background:#edf4ef;color:#587a69;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-.045em;margin:18px 0 14px}
    p{font-size:17px;color:var(--muted);margin:0 0 14px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
    a{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:999px;text-decoration:none;font-weight:800}
    .primary{background:var(--ink);color:#fff}
    .secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
  </style>
</head>
<body>
  <main class="box">
    <div class="tag">Message envoyé</div>
    <h1>Merci pour votre message.</h1>
    <p>Votre demande a bien été transmise à CAP DEGRÉ°.</p>
    <p>Nous reviendrons vers vous dès que possible pour mieux comprendre votre besoin et voir comment vous aider utilement.</p>
    <div class="actions">
      <a class="primary" href="/">Retour à l'accueil</a>
      <a class="secondary" href="/#prestations">Voir les prestations</a>
    </div>
  <p style="font-size:13px;margin-top:25px"><a style="background:transparent;color:#18313b;border:1px solid #dbe4dd;padding:10px 15px" href="#choix-statistiques" data-manage-matomo>Gérer les statistiques</a></p></main>
  <script defer src="/matomo-consent.js"></script>
</body>
</html>
